[package]
name = "yniffi"
version = "0.1.0"
description = "uniffi binding of yrs for the YSwift sources in the RelayMark Swift package, vendored from yswift"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "yniffi"

[dependencies]
# Yrs 0.28.0 + Relay patches pending upstream (y-crdt#656, #657, #674):
# boldflight/y-crdt branch relay. Collaboration with the server (Yex/Yjs)
# depends on this exact revision; change it only together with the server.
yrs = { git = "https://github.com/boldflight/y-crdt.git", rev = "02745a0526fc927bb71e3ba551450df66a287d6c", features = ["sync"] }
thiserror = "1.0.38"
uniffi = "0.32"
serde_json = "1.0"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[dev-dependencies]
base64 = "0.22"
