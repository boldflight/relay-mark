[package]
name = "relaymark-apple"
version = "0.1.0"
description = "The one Rust library of the RelayMark Swift package: every uniffi binding the Apple platforms link"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]
name = "relaymark_apple"

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
relaymark-ffi = { path = "../relaymark-ffi" }
yniffi = { path = "../yniffi" }
uniffi = "0.32"
