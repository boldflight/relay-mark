name: RelayMark Cross-Runtime

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relaymark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-runtime:
    name: Portable contract and JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore exact JavaScript dependencies
        run: npm ci

      - name: Verify portable contract
        run: |
          npm run check:contract
          npm test
          npm run conformance

  elixir-adapter:
    name: Elixir adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Restore exact dependencies
        working-directory: adapters/elixir
        run: mix deps.get --check-locked

      - name: Verify Elixir adapter against shared fixtures
        working-directory: adapters/elixir
        run: |
          mix test
          mix hex.build
